# Moves the SHA-pinned `uses:` in .github/workflows, rewriting the SHA and its
# trailing version comment together. The formula itself is not covered: it is
# generated by say-hi's release workflow, which opens its own PRs here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # let a release age before its bump PR - a freshly compromised release's
    # window is its first days (zizmor: dependabot-cooldown)
    cooldown:
      default-days: 7
    # every bump a week lands in a single review
    groups:
      all:
        patterns:
          - "*"
    commit-message:
      prefix: deps
