# Names what dependabot could move: the SHA-pinned `uses:` in the workflows
# and composite actions.
#
# What this file cannot cover, and what covers it instead:
#
#   * Formula/: say-hi's release workflow opens its pull requests, and
#     drift.yml reports a formula behind say-hi's latest release.
#
# Renovate was weighed and declined: it would cover the pins this file cannot,
# but costs a second bot, its own config dialect, and a PR stream where
# tool-versions.yml keeps one tracking issue.
#
# Each entry sets `open-pull-requests-limit: 0`, so no version-update pull
# request opens: tool-versions.yml reports the same drift in one tracking
# issue, and every bump is a hand edit made from it. Deleting the limits turns
# the pull requests back on, with the schedule, cooldown and ignores they
# need. Dependabot security updates, if enabled in the repository settings,
# are not bound by the limit and still open their own pull requests.
version: 2

updates:
  # the composite actions under .github/actions/ pin their own `uses:`
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    commit-message:
      prefix: deps
    open-pull-requests-limit: 0
    # let a release age before its bump: a compromised release's window is its
    # first days (zizmor: dependabot-cooldown)
    cooldown:
      default-days: 7
